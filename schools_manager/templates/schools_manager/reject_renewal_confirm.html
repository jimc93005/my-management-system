<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reject Renewal - {{ renewal.school.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Reject Renewal Application</h5>
                    </div>
                    <div class="card-body p-4">
                        <p>Are you sure you want to reject the <strong>{{ renewal.get_billing_cycle_display }}</strong> renewal request for <strong>{{ renewal.school.name }}</strong>?</p>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="admin_notes" class="form-label fw-bold">Reason for Rejection (Admin Notes):</label>
                                <textarea name="admin_notes" id="admin_notes" class="form-control" rows="3" placeholder="e.g., Unclear bank statement, invalid transaction reference..." required></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'tenant_admin_site:schools_manager_subscriptionrenewal_changelist' %}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-danger">Confirm Rejection</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
