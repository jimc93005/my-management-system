{% extends 'students_app/base.html' %} <!-- Change this to whatever your main site base template is named -->

{% block content %}
<div class="container-fluid py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="fas fa-cogs text-primary me-2"></i>Timetable Configuration</h2>
            <p class="text-muted mb-0">Manage settings, rooms, and subject rules for auto-generation.</p>
        </div>
    </div>

    <div class="row">
        <!-- Sidebar Navigation Menu -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div class="list-group shadow-sm">

                <!-- Tab 1: General Settings & Breaks -->
                <a href="{% url 'timetable:setup_settings' %}"
                   class="list-group-item list-group-item-action {% if active_tab == 'settings' %}active{% endif %}">
                    <i class="fas fa-sliders-h me-2"></i> 1. General Settings
                </a>

                <!-- Tab 2: Rooms -->
                <a href="{% url 'timetable:setup_rooms' %}"
                   class="list-group-item list-group-item-action {% if active_tab == 'rooms' %}active{% endif %}">
                    <i class="fas fa-door-open me-2"></i> 2. Rooms
                </a>

                <a href="{% url 'timetable:setup_teachers' %}" class="list-group-item list-group-item-action {% if active_tab == 'teachers' %}active fw-bold shadow-sm{% else %}text-secondary{% endif %} border-0 py-3 rounded mb-1">
                   <i class="fas fa-user-clock me-3 {% if active_tab == 'teachers' %}text-white{% else %}text-muted{% endif %}"></i>Staff Availability
                </a>

                <!-- Tab 3: Subject Constraints -->
                <a href="{% url 'timetable:setup_constraints' %}"
                   class="list-group-item list-group-item-action {% if active_tab == 'constraints' %}active{% endif %}">
                    <i class="fas fa-book me-2"></i> 3. Subject Rules
                </a>

                <!-- Tab 4: Generate -->
                <a href="{% url 'timetable:setup_generate' %}"
                   class="list-group-item list-group-item-action {% if active_tab == 'generate' %}active{% endif %}">
                    <i class="fas fa-magic me-2"></i> 4. Generate & Review
                </a>

            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="col-md-9 col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    {% block setup_content %}
                    <!-- The specific forms will render here -->
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
