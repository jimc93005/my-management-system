{% extends 'students_app/base.html' %}
{% load bootstrap4 %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="mb-4">
                <a href="{% url 'students_app:department_events' sub_dept.id %}" class="btn btn-outline-secondary rounded-pill btn-sm shadow-sm font-weight-bold px-3">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Events
                </a>
            </div>

            <div class="card border-0 shadow-lg rounded-lg overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4 border-0">
                    <h3 class="mb-0 font-weight-bold">Schedule Event</h3>
                    <p class="mb-0 text-white-50 small">For {{ sub_dept.name }}</p>
                </div>

                <div class="card-body p-4 bg-light">
                    <form method="post" action="">
                        {% csrf_token %}
                        <div class="bg-white p-4 rounded shadow-sm border mb-4">
                            {% bootstrap_form form %}
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow px-5 font-weight-bold">
                                Save Event
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
