{% extends 'students_app/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg rounded-lg overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4 border-0">
                    <i class="fas fa-bullhorn fa-3x mb-3"></i>
                    <h3 class="mb-0 font-weight-bold">Broadcast to Staff</h3>
                    <p class="mb-0 text-white-50 small">Send an official announcement to all registered staff.</p>
                </div>
                <div class="card-body p-5 bg-light">
                    <form method="post" action="{% url 'students_app:broadcast_message' %}">
                        {% csrf_token %}
                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-dark">Subject / Title</label>
                            <input type="text" name="title" class="form-control form-control-lg shadow-sm" required placeholder="e.g., Staff Meeting Tomorrow at 8 AM">
                        </div>
                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-dark">Message content</label>
                            <textarea name="message" class="form-control shadow-sm" rows="6" required placeholder="Type your full announcement here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block rounded-pill shadow font-weight-bold">
                            <i class="fas fa-paper-plane mr-2"></i> Send to All Staff
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
