{% extends 'students_app/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-lg rounded-lg mt-5 text-center">
                <div class="card-body p-5">

                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-4 shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem;">
                        <i class="fas fa-check"></i>
                    </div>

                    <h2 class="font-weight-bold text-dark mb-3">Logged Out</h2>
                    <p class="text-muted mb-4" style="font-size: 1.1rem;">
                        You have been securely signed out of the School Management System. Thank you for your hard work today!
                    </p>

                    <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg rounded-pill shadow-sm font-weight-bold px-5 mt-2">
                        <i class="fas fa-sign-in-alt mr-2"></i> Log In Again
                    </a>

                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted small">School Management System &copy; 2026</p>
            </div>

        </div>
    </div>
</div>

<style>
    body { background-color: #f0f2f5; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Slight hover effect for the button */
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3) !important;
        transition: all 0.3s ease;
    }
</style>
{% endblock %}
